<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Amal Attendance | Service status</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #162638; background: #f3f6fa; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; }
    main { width: min(100%, 490px); padding: clamp(28px, 7vw, 44px); background: #fff; border: 1px solid #dbe3ec; border-radius: 18px; }
    .brand { margin: 0; color: #145a99; font-weight: 700; }
    h1 { margin: 14px 0; font-size: clamp(1.7rem, 5vw, 2.25rem); line-height: 1.15; letter-spacing: -.025em; }
    p { margin: 0; color: #45586b; line-height: 1.6; }
  </style>
</head>
<body>
  <main aria-labelledby="status">
    <p class="brand">Amal Attendance</p>
    <h1 id="status">Staff sign-in is temporarily unavailable</h1>
    <p>The attendance database is offline. Check back once service has been restored.</p>
  </main>
</body>
</html>
